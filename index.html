<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100vw; }
        #ui-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; gap: 10px; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; background: #2c3e50; color: white; font-weight: bold; }
        button.active { background: #27ae60; }
        #motd-bar { position: absolute; bottom: 0; width: 100%; background: rgba(44, 62, 80, 0.9); color: white; padding: 15px; z-index: 1000; text-align: center; box-sizing: border-box; border-top: 2px solid #27ae60; }
        .custom-popup { text-align: center; max-width: 250px; }
        .memory-img { max-width: 100%; margin-top: 10px; border-radius: 4px; }
        .input-field { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        .action-btn { background: #2980b9; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="ui-container">
        <button id="btn-search" class="active">Mountain Search</button>
        <button id="btn-scrapbook">Scrapbook</button>
    </div>
    
    <div id="map"></div>

    <div id="motd-bar">
        <strong>Mountain of the Day:</strong> <span id="motd-content">Loading today's peak...</span>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJxZ_WeFQZVkGXfY3banGJGi4a38GnELk",
            authDomain: "mom-s-travel-log.firebaseapp.com",
            projectId: "mom-s-travel-log",
            storageBucket: "mom-s-travel-log.firebasestorage.app",
            messagingSenderId: "945286002146",
            appId: "1:945286002146:web:2f6616a8a25a1a8a49f5bb"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        const map = L.map('map').setView([39.8283, -98.5795], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let currentMarkers = L.layerGroup().addTo(map);

        const btnSearch = document.getElementById('btn-search');
        const btnScrapbook = document.getElementById('btn-scrapbook');
        const motdContent = document.getElementById('motd-content');

        async function init() {
            const response = await fetch('data.json');
            const data = await response.json();
            
            setMOTD(data.mountains);
            loadMountainSearch(data.mountains);
        }

        function setMOTD(mountains) {
            const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
            const dailyPeak = mountains[dayOfYear % mountains.length];
            motdContent.innerHTML = `${dailyPeak.name} - ${dailyPeak.fun_fact}`;
        }

        function loadMountainSearch(mountains) {
            currentMarkers.clearLayers();
            map.off('click');
            mountains.forEach(mtn => {
                const marker = L.marker([mtn.lat, mtn.lng]).addTo(currentMarkers);
                marker.bindPopup(`
                    <div class="custom-popup">
                        <h3>${mtn.name}</h3>
                        <p>${mtn.inspirational_story}</p>
                        <a href="${mtn.database_link}" target="_blank">View Details</a>
                    </div>
                `);
            });
        }

        async function loadScrapbook() {
            currentMarkers.clearLayers();
            const querySnapshot = await getDocs(collection(db, "scrapbook_entries"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const marker = L.marker([data.lat, data.lng]).addTo(currentMarkers);
                marker.bindPopup(`
                    <div class="custom-popup">
                        <h3>${data.title}</h3>
                        <img src="${data.imageUrl}" class="memory-img">
                    </div>
                `);
            });

            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                const tempMarker = L.marker([lat, lng]).addTo(currentMarkers);
                
                const popupContent = document.createElement('div');
                popupContent.innerHTML = `
                    <div class="custom-popup">
                        <h3>New Memory</h3>
                        <input type="text" id="mem-title" class="input-field" placeholder="Location Name">
                        <input type="file" id="mem-file" accept="image/*" class="input-field">
                        <button id="mem-save" class="action-btn">Save</button>
                        <p id="mem-status"></p>
                    </div>
                `;

                tempMarker.bindPopup(popupContent).openPopup();

                document.getElementById('mem-save').onclick = async () => {
                    const title = document.getElementById('mem-title').value;
                    const fileInput = document.getElementById('mem-file');
                    const status = document.getElementById('mem-status');
                    const file = fileInput.files[0];

                    if (!title || !file) {
                        status.innerText = "Add title and photo";
                        return;
                    }

                    status.innerText = "Uploading...";
                    const storageRef = ref(storage, 'scrapbook_photos/' + Date.now() + "_" + file.name);
                    
                    try {
                        const snapshot = await uploadBytes(storageRef, file);
                        const url = await getDownloadURL(snapshot.ref);
                        await addDoc(collection(db, "scrapbook_entries"), {
                            title: title, lat: lat, lng: lng, imageUrl: url
                        });
                        status.innerText = "Saved!";
                        setTimeout(() => loadScrapbook(), 1000);
                    } catch (error) {
                        status.innerText = "Upload failed";
                    }
                };
            });
        }

        btnSearch.onclick = async () => {
            btnSearch.classList.add('active');
            btnScrapbook.classList.remove('active');
            const response = await fetch('data.json');
            const data = await response.json();
            loadMountainSearch(data.mountains);
        };

        btnScrapbook.onclick = () => {
            btnScrapbook.classList.add('active');
            btnSearch.classList.remove('active');
            loadScrapbook();
        };

        init();
    </script>
</body>
</html>
